<style>
  :root {
    --yellow: #FEF7DC;
    --black: #070707;
    --white: #f5f2ec;
    --dim: rgba(245,242,236,0.62);
    --faint: rgba(245,242,236,0.4);
    --line: rgba(254,247,220,0.09);
    --font-display: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--black); color: var(--white);
    font-family: var(--font-display);
    min-height: 100dvh;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: none; }
  ::selection { background: var(--yellow); color: var(--black); }

  /* custom cursor only on real mice */
  #cursor { display: none; }
  @media (hover: hover) and (pointer: fine) {
    body, button, a { cursor: none; }
    #cursor {
      display: block; position: fixed; top: 0; left: 0; z-index: 9999;
      width: 8px; height: 8px; background: var(--yellow); border-radius: 50%;
      pointer-events: none; transform: translate(-50%, -50%);
      transition: width .2s, height .2s; mix-blend-mode: difference;
    }
    #cursor.big { width: 28px; height: 28px; }
  }

  /* stars */
  #stars { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .star { position: absolute; border-radius: 50%; background: var(--white); opacity: 0;
    animation: twinkle var(--d,3s) ease-in-out infinite var(--delay,0s); }
  @keyframes twinkle { 0%,100%{opacity:0} 50%{opacity:var(--op,.6)} }

  /* ── HEADER ── */
  #top { position: relative; z-index: 20; padding: max(24px, env(safe-area-inset-top)) 20px 8px; }
  .name {
    font-weight: 800; font-size: 34px; letter-spacing: -0.02em; line-height: 1;
    color: var(--yellow); margin-bottom: 14px;
  }
  .intro { font-size: 14px; line-height: 1.6; color: var(--dim); max-width: 360px; }
  .intro p + p { margin-top: 6px; }
  .intro b { color: var(--white); font-weight: 600; }
  .intro .lead { color: var(--white); margin-bottom: 10px; }
  .intro ul { list-style: none; }
  .intro li { position: relative; padding-left: 18px; }
  .intro li + li { margin-top: 6px; }
  .intro li::before { content: '✦'; position: absolute; left: 0; top: 0; font-size: 10px; color: var(--yellow); opacity: .6; }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
  .links { display: flex; gap: 16px; }
  .links a {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em;

  .links a:hover { opacity: 1; }
  .toggle { display: inline-flex; border: 1px solid rgba(254,247,220,.18); border-radius: 999px; padding: 2px; }
  .toggle button {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em;
    padding: 6px 12px; border-radius: 999px; color: var(--faint);
    transition: background .2s, color .2s; min-height: 32px;
  }
  .toggle button[aria-pressed="true"] { background: var(--yellow); color: var(--black); }

  /* ── ORBIT VIEW ── */
  body.orbit { height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
  #stage { position: relative; z-index: 1; flex: 1; min-height: 0; }
  body.list #stage { display: none; }
  #system { position: absolute; inset: 0; }
  .ring { position: absolute; border-radius: 50%; border: 1px solid rgba(254,247,220,.07);
    transform: translate(-50%,-50%); pointer-events: none; }
  .body-btn {
    position: absolute; border-radius: 50%; transform: translate(-50%,-50%);
    transition: filter .25s; z-index: 5; padding: 0;
  }
  .body-btn:hover, .body-btn:focus-visible { filter: brightness(1.18); }
  .body-btn:focus-visible { outline: 1px dashed var(--yellow); outline-offset: 6px; }
  .body-btn .orb { width: 100%; height: 100%; border-radius: 50%; transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
  .body-btn:hover .orb { transform: scale(1.12); }
  .tag {
    position: absolute; transform: translateX(-50%); z-index: 50;
    white-space: nowrap; text-align: center; pointer-events: none;
    font-weight: 700; font-size: 13px; color: var(--yellow); letter-spacing: .03em;
    text-shadow: 0 0 6px #070707, 0 0 12px #070707, 0 0 2px #070707;
  }
  #sun .orb {
    position: relative;
    background: radial-gradient(circle at 36% 36%, #fffde0, #FEF7DC 55%, #c8a000);
  }
  #sun-glow {
    position: absolute; border-radius: 50%; transform: translate(-50%,-50%); pointer-events: none; z-index: 2;
    background: radial-gradient(circle, rgba(254,220,60,.30) 0%, rgba(254,220,60,.12) 30%, rgba(254,247,220,.04) 55%, transparent 70%);
    animation: pulse-sun 4s ease-in-out infinite;
  }
  @keyframes pulse-sun { 0%,100%{opacity:.8} 50%{opacity:1} }
  #hint {
    position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    font-family: var(--font-mono); font-size: 11px; color: rgba(245,242,236,.32); letter-spacing: .14em;
    white-space: nowrap; pointer-events: none; animation: fade-hint 8s ease forwards 2s;
  }
  @keyframes fade-hint { 0%,70%{opacity:1} 100%{opacity:0} }

  @media (min-width: 900px) {
    body.orbit #top { position: fixed; top: 32px; left: 40px; padding: 0; max-width: 380px; }
    body.orbit #stage { position: fixed; inset: 0; }
    .name { font-size: 40px; }
  }

  /* ── LIST VIEW ── */
  #list { display: none; position: relative; z-index: 1; }
  body.list #list { display: block; }
  body.list #top, #list .wrap { max-width: 680px; margin: 0 auto; }
  body.list #top { padding-top: max(48px, env(safe-area-inset-top)); }
  #list .wrap { padding: 8px 20px 96px; }
  .sec { margin-top: 56px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 8px; }
  .sec-title { font-weight: 800; font-size: 22px; color: var(--yellow); }
  .sec-desc { font-family: var(--font-mono); font-size: 11px; color: var(--faint); letter-spacing: .08em; text-align: right; }
  .about-text { font-size: 16px; line-height: 1.75; color: var(--dim); }
  .about-text p + p { margin-top: 14px; }
  .about-text a { color: var(--yellow); text-decoration: none; border-bottom: 1px solid rgba(254,247,220,.3); }

  /* ── shared item cards ── */
  .items { display: flex; flex-direction: column; }
  .item {
    display: grid; grid-template-columns: 36px 1fr; gap: 14px;
    padding: 18px 4px; border-bottom: 1px solid var(--line);
  }
  .item:last-child { border-bottom: none; }
  .dot { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; margin-top: 2px; }
  .dot i { width: 14px; height: 14px; border-radius: 50%; display: block; }
  .item-title { font-weight: 700; font-size: 16px; line-height: 1.35; color: var(--white); }
  .item-meta { font-family: var(--font-mono); font-size: 11px; color: var(--faint); letter-spacing: .08em; margin-top: 4px; }
  .item-blurb { font-size: 14px; line-height: 1.6; color: var(--dim); margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .chip { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; color: var(--faint);
    border: 1px solid var(--line); padding: 2px 7px; border-radius: 2px; }
  .actions { display: flex; gap: 18px; margin-top: 12px; }
  .act {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; color: var(--yellow);
    text-decoration: none; border-bottom: 1px solid rgba(254,247,220,.3); padding: 4px 0 1px; opacity: .85;
  }
  .act:hover { opacity: 1; }
  .more { display: inline-block; margin-top: 14px; }
  .quest { display: grid; grid-template-columns: 104px 1fr; gap: 12px; align-items: center;
    padding: 12px 4px; border-bottom: 1px solid var(--line); }
  .quest:last-child { border-bottom: none; }
  .q-status { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; padding: 3px 7px;
    border-radius: 2px; justify-self: start; white-space: nowrap; }
  .q-status.completed { color: #a0e0c0; border: 1px solid rgba(160,224,192,.3); }
  .q-status.scheduled { color: #a0c0e8; border: 1px solid rgba(160,192,232,.3); }
  .q-status.progress  { color: #FEF7DC; border: 1px solid rgba(254,247,220,.22); }
  .q-status.open      { color: rgba(245,242,236,.3); border: 1px solid rgba(254,247,220,.08); }
  .q-name { font-size: 14px; color: var(--white); }
  .q-detail { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--faint); margin-top: 2px; }

  /* ── PANEL (orbit view) ── */
  #panel {
    position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
    background: rgba(7,7,7,0); pointer-events: none; transition: background .4s; padding: 16px;
  }
  #panel.active { background: rgba(7,7,7,.97); pointer-events: all; }
  #panel-inner {
    width: min(720px, 100%); max-height: 86dvh; overflow-y: auto; overscroll-behavior: contain;
    opacity: 0; transform: scale(.94); transition: opacity .35s, transform .35s cubic-bezier(.34,1.2,.64,1);
    scrollbar-width: none;
  }
  #panel-inner::-webkit-scrollbar { display: none; }
  #panel.active #panel-inner { opacity: 1; transform: none; }
  .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 14px; }
  .panel-title { font-weight: 800; font-size: clamp(28px, 7vw, 44px); color: var(--yellow); line-height: 1; }
  .panel-desc { font-family: var(--font-mono); font-size: 11px; color: var(--faint); letter-spacing: .1em; margin-top: 8px; }
  .close {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; padding: 8px 12px;
    border: 1px solid rgba(254,247,220,.2); border-radius: 2px; flex-shrink: 0; min-height: 36px;
  }
  .close:hover { border-color: var(--yellow); color: var(--yellow); }

  /* ── DETAIL PAGE ── */
  #detail {
    position: fixed; inset: 0; z-index: 200; background: var(--black); overflow-y: auto;
    transform: translateX(100%); transition: transform .5s cubic-bezier(.77,0,.18,1); visibility: hidden;
  }
  #detail.open { transform: none; visibility: visible; }
  .detail-inner { max-width: 650px; margin: 0 auto; padding: max(40px, env(safe-area-inset-top)) 20px 120px; }
  .back { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; color: var(--faint);
    margin-bottom: 40px; padding: 6px 0; }
  .back:hover { color: var(--yellow); }
  .d-eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .16em; color: var(--yellow); opacity: .6; margin-bottom: 12px; }
  .d-title { font-weight: 800; font-size: clamp(28px, 7vw, 46px); line-height: 1.05; letter-spacing: -.02em; margin-bottom: 14px; }
  .d-meta { font-family: var(--font-mono); font-size: 12px; color: var(--faint); line-height: 1.6;
    padding-bottom: 24px; margin-bottom: 36px; border-bottom: 1px solid var(--line); }
  .d-meta a { color: var(--yellow); text-decoration: none; border-bottom: 1px solid rgba(254,247,220,.3); }
  .d-sec { margin-bottom: 36px; }
  .d-num { font-family: var(--font-mono); font-size: 10px; color: var(--yellow); opacity: .45; letter-spacing: .18em; margin-bottom: 6px; }
  .d-h { font-weight: 700; font-style: italic; font-size: 18px; margin-bottom: 10px; }
  .d-body { font-size: 16px; line-height: 1.8; color: var(--dim); }
  .d-body a { color: var(--yellow); text-decoration: none; border-bottom: 1px solid rgba(254,247,220,.3); }
  .d-body ul { padding-left: 18px; }
  .d-body li + li { margin-top: 4px; }
  .d-stack { margin-top: 44px; }
  .d-stack .chip { color: var(--yellow); opacity: .7; border-color: rgba(254,247,220,.16); font-size: 11px; }

  @media (prefers-reduced-motion: reduce) {
    .star, #sun-glow { animation: none; }
    .star { opacity: .35; }
  }
</style>
</head>

<script>
/* ───────────── CONTENT ───────────── */

const ABOUT = `
  <p>by day i work in ai product strategy &amp; ops, in consulting. most of it is sitting between the people who want an ai product and the engineers building it, and getting it from prototype to something people actually use. before that i did diligence and integration work on tech deals.</p>
  <p>in my free time i write long commercial breakdowns of ai companies: who buys, why, what has to be true, and how the plan is going so far.</p>
  <p>i also build small things. mostly i fork repos i think are cool and take them apart until i understand them.</p>
  <p>based in nyc. find me on <a href="https://substack.com/@notshananigans" target="_blank" rel="noopener">substack</a> and <a href="https://x.com/notshananigans" target="_blank" rel="noopener">x</a>, where projects, art, music and miscellany are very much solicited :D</p>
`;

const WRITING = [
  {
    title: 'inside simile: what it means to simulate human behavior for enterprises',
    date: 'apr 2026',
    blurb: "how simile's ai agents work, where they fit into real customer research workflows, and a scorecard for which enterprise use cases to go after first.",
    tags: ['go-to-market', 'ai agents', 'enterprise software', 'customer research'],
    link: 'https://notshananigans.substack.com/p/inside-simile-what-it-means-to-simulate',
    color: '#E05A4E'
  },
  {
    title: 'the humans grading ai: on the contractor problem at the heart of frontier model training',
    date: 'apr 2026',
    blurb: 'scale, surge, mercor and the rest sell expert judgment to frontier labs. the hard part is getting consistent, elite work out of a contractor base that can leave whenever it wants.',
    tags: ['ai infrastructure', 'post-training', 'marketplaces', 'operations'],
    link: 'https://notshananigans.substack.com/p/the-humans-grading-the-ai-on-the',
    color: '#7ab8d4'
  }
];

const LINK = (href, text) => `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;

const BUILDS = [
  {
    id: 'photobooth',
    title: 'get in da (photo)booth',
    short: 'a browser photobooth that reacts to your face. three models, no server.',
    link: 'https://get-in-da-booth.netlify.app/',
    color: '#e8a8c7',
    stack: ['face-api.js', 'mediapipe hands', 'claude', 'netlify'],
    sections: {
      started: `as always, it started with an x post. it was figmathon season, and i came across ${LINK('https://x.com/lalizlabeth/status/1966002793371619353?s=46', "@lalizlabeth")}'s #figmamakeathon submission where you can meow with your hands. catgirl allegations aside, it's super cute. it also reminded me of ${LINK('https://x.com/immike_wing/status/2009057802400969150?s=46', "@immike_wing")}'s arc'teryx beanie detector, which is pretty funny. both got me thinking about what image detection can actually do in the browser, and how approachable it's gotten.`,
      goal: `a simple photobooth with sounds. i had just come off a tiktok and megan thee stallion bender, so they made it into the audio.`,
      process: `there are two components: detection and sounds.<br/><br/><b>detection:</b> the app runs three neural network models entirely in the browser with face-api.js. one finds your face, one maps 68 landmark points across it (corners of your mouth, tip of your nose, jaw outline), and one classifies your expression into one of 7 emotions. gestures are computed from those coordinates directly. duck face checks whether your mouth is unusually narrow relative to your face.<br/><br/><b>sounds:</b> short clips, triggered on detection, with cooldown timers so they don't spam.<br/><br/>claude pretty much one-shotted the working prototype. there was some back and forth on thresholds and cooldowns, but it came together fast. two problems didn't have an easy fix:<br/><br/>i was quite excited about megan's ah. the landmark model has no tongue keypoint, only "mouth very extremely open," which fires on fah and ah pretty interchangeably. hand gestures (finger gun, heart) are also unreliable. the lite model running in-browser silently skips frames depending on lighting, hand angle and distance. i cut both for now. a vision api call to check for tongue specifically felt like overkill for a silly project.`,
      result: `issues aside, it can do some stuff:<br/><ul><li>live emotion detection with color washes. happy goes warm yellow, surprised triggers a flash and zoom</li><li>fah / ah when your mouth opens</li></ul><br/>the part i found most interesting: no server, no backend, no api calls. models load from a cdn in a few seconds and everything runs on your device.`,
      next: `<ul><li>snapchat-style filters. i grew up on those, so face-tracked overlays (dog ears, talking orange) will be fun to recreate</li><li>real tongue detection, either a model with tongue keypoints or a lightweight vision api call</li><li>hand gestures that work. finger gun and korean heart are in the code, they just don't fire reliably. worth testing whether a heavier model or better calibration fixes it</li></ul>`
    }
  },
  {
    id: 'shoyo',
    title: 'shoyo, but infinite',
    short: 'an open-source infinite canvas, forked and refilled with ai-generated hinata figurines.',
    link: 'https://just-shoyo-activities-v2.vercel.app/',
    color: '#f0a050',
    stack: ['react', 'three.js / r3f', 'vite', 'tailwind', 'chatgpt images', 'vercel'],
    sections: {
      started: `${LINK('https://x.com/phatggg', '@phatggg')} built ${LINK('https://www.yyyyaaa.com/', 'yyyyaaa.com')}: an endless white void full of tiny dioramas of the same guy doing strange office tasks. very severance. then he ${LINK('https://github.com/yyyyaaa/yyyyaaa-2026', 'open-sourced it')}. i wanted to know if i could keep the engine and swap everything on top of it.`,
      goal: `same infinite canvas, different universe: hinata shoyo from haikyuu, in figurine form, doing small ordinary things forever. something you wander through more than read.`,
      process: `two parts: the engine and the images.<br/><br/><b>engine:</b> the canvas is react three fiber. the world is split into chunks, and only chunks near the camera render. images lazy-load, fade with depth, and you can drag, scroll, pinch or use wasd. i mostly left the engine alone and learned it by reading it. my changes sat on top: the image manifest, the overlay (logo, a "fan request" button that opens a pre-filled post to me on x, an fyi panel crediting the original), and seo.<br/><br/><b>images:</b> 14 figurine dioramas generated in chatgpt from one long prompt. the hard part was consistency. early outputs drifted chibi or landed on blocky, lego-looking bases, so the prompt grew a negative section that bans both. the full prompt is in the fyi panel on the site if you want to make your own.`,
      result: `an infinite gallery of hinata spiking, sleeping, feeding crows, carrying groceries, eating ramen and texting kageyama. it works on phones with touch. the engine held up fine with a completely different set of images, which was the real test of the fork.`,
      next: `<ul><li>fulfill fan requests as they come in</li><li>more poses, so the canvas repeats less as you wander</li></ul>`
    }
  }
];

  { name: 'make an animated series', status: 'open' },
  { name: '3d print figurines', status: 'open' }
];

  about:    { title: 'about', desc: 'center of it all' },

  building: { title: 'building', desc: 'small things, taken apart' },
  quests:   { title: 'side quests', desc: 'do we have quests in common?' }
};

/* ───────────── RENDERERS (shared by panel + list) ───────────── */

const dot = c => `<div class="dot" style="background:${c}18;border:1px solid ${c}40"><i style="background:${c};box-shadow:0 0 8px 2px ${c}55"></i></div>`;

function renderWriting() {
  return `<div class="items">${WRITING.map(w => `
    <article class="item">
      ${dot(w.color)}
      <div>
        <div class="item-title">${w.title}</div>
        <div class="item-meta">${w.date}</div>
        <p class="item-blurb">${w.blurb}</p>
        <div class="chips">${w.tags.map(t => `<span class="chip">${t}</span>`).join('')}</div>
        <div class="actions"><a class="act" href="${w.link}" target="_blank" rel="noopener">read ↗</a></div>
      </div>
    </article>`).join('')}
  </div>
  <a class="act more" href="https://notshananigans.substack.com/archive" target="_blank" rel="noopener">everything on substack ↗</a>`;
}

function renderBuilds() {
  return `<div class="items">${BUILDS.map(b => `
    <article class="item">
      ${dot(b.color)}
      <div>
        <div class="item-title">${b.title}</div>
        <p class="item-blurb">${b.short}</p>
        <div class="chips">${b.stack.map(s => `<span class="chip">${s}</span>`).join('')}</div>
        <div class="actions">
          <a class="act" href="${b.link}" target="_blank" rel="noopener">try it ↗</a>
          <button type="button" class="act" onclick="openDetail('${b.id}')">how i built it →</button>
        </div>
      </div>
    </article>`).join('')}
  </div>`;
}

function renderQuests() {
  const label = { completed: 'done ✓', scheduled: 'scheduled', progress: 'in progress', open: 'someday' };
  return `<div class="items">${QUESTS.map(q => `
    <div class="quest">
      <span class="q-status ${q.status}">${label[q.status]}</span>
      <span class="q-name">${q.name}${q.detail ? `<span class="q-detail">${q.detail}</span>` : ''}</span>
    </div>`).join('')}
  </div>`;
}

const RENDER = {
  about: () => `<div class="about-text">${ABOUT}</div>`,
  writing: renderWriting,
  building: renderBuilds,
  quests: renderQuests
};

/* ───────────── LIST VIEW ───────────── */

document.getElementById('list-wrap').innerHTML = ['writing', 'building', 'quests', 'about'].map(k => `
  <section class="sec" id="sec-${k}">
    <div class="sec-head"><h2 class="sec-title">${SECTIONS[k].title}</h2><span class="sec-desc">${SECTIONS[k].desc}</span></div>
    ${RENDER[k]()}
  </section>`).join('');

/* ───────────── ORBIT VIEW ───────────── */

const TILT = 0.36;
const SUN = { id: 'sun', key: 'about', size: 116 };
const PLANETS = [
  { id: 'writing',  key: 'writing',  color: '#6aafcf', size: 78, r: 200, speed: 0.10, angle: 0.6 },
  { id: 'building', key: 'building', color: '#e0a86e', size: 64, r: 300, speed: 0.065, angle: 3.3 },
  { id: 'quests',   key: 'quests',   color: '#d4795a', size: 50, r: 392, speed: 0.045, angle: 2.0 }
];
const MOON = { color: '#eef2f5', size: 13, r: 64, speed: 0.4, angle: 1.2 }; // decorative, orbits writing

const system = document.getElementById('system');
const stage = document.getElementById('stage');
const glow = document.createElement('div'); glow.id = 'sun-glow'; system.appendChild(glow);

function makeBody(p, isSun) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'body-btn';
  if (isSun) b.id = 'sun';
  b.setAttribute('aria-label', `open ${SECTIONS[p.key].title}`);
  const orb = document.createElement('div');
  orb.className = 'orb';
  if (!isSun) orb.style.cssText = `background:radial-gradient(circle at 35% 35%, ${p.color}, ${p.color}cc 60%, ${p.color}88);box-shadow:0 0 40px 8px ${p.color}40;`;
  b.appendChild(orb);
  b.addEventListener('click', () => openPanel(p.key));
  system.appendChild(b);
  // labels live in their own top layer so the sun and moon never cover them
  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.textContent = SECTIONS[p.key].title;
  b._tag = tag;
  return b;
}

const rings = PLANETS.map(() => { const r = document.createElement('div'); r.className = 'ring'; system.appendChild(r); return r; });
const sunEl = makeBody(SUN, true);
const planetEls = PLANETS.map(p => ({ p, el: makeBody(p, false), a: p.angle }));
const moonEl = document.createElement('div');
moonEl.style.cssText = `position:absolute;border-radius:50%;background:${MOON.color};box-shadow:0 0 10px 2px ${MOON.color}aa;transform:translate(-50%,-50%);pointer-events:none;z-index:6`;
system.appendChild(moonEl);
[sunEl, ...planetEls.map(x => x.el)].forEach(el => system.appendChild(el._tag));
let moonA = MOON.angle;

let geo = { cx: 0, cy: 0, s: 1, portrait: false };
function layout() {
  const w = stage.clientWidth, h = stage.clientHeight;
  const portrait = h > w * 1.05;
  const maxR = PLANETS[PLANETS.length - 1].r;
  const big = Math.max(...PLANETS.map(p => p.size));
  const labelPad = 40;
  // half-extents of the system at scale 1
  const halfW = portrait ? maxR * TILT + big / 2 + 70 : maxR + big / 2 + 40;
  const halfH = portrait ? maxR + big / 2 + labelPad : maxR * TILT + big / 2 + labelPad;
  let s = Math.min((w / 2 - 8) / halfW, (h / 2 - 8) / halfH, 1.2);
  let cy = h / 2;
  // desktop: the intro floats over the top-left; if the system would run into it,
  // fit the system into the space below the intro instead
  if (!portrait && window.innerWidth >= 900) {
    const hb = document.getElementById('top').getBoundingClientRect();
    const overlaps = (cy - halfH * s) < hb.bottom + 12 && (w / 2 - halfW * s) < hb.right;
    if (overlaps) {
      const top = hb.bottom + 12, usable = h - top - 30;
      s = Math.min((w / 2 - 8) / halfW, usable / 2 / halfH, 1.2);
      cy = top + usable / 2;
    }
  }
  geo = { cx: w / 2, cy, s, portrait };

  PLANETS.forEach((p, i) => {
    const a = p.r * 2 * s, b = p.r * 2 * TILT * s;
    rings[i].style.width = (portrait ? b : a) + 'px';
    rings[i].style.height = (portrait ? a : b) + 'px';
    rings[i].style.left = geo.cx + 'px';
    rings[i].style.top = geo.cy + 'px';
  });
  const sz = v => Math.max(v * s, v * 0.5);
  const sunPx = sz(SUN.size) * (portrait ? 0.8 : 1);
  sunEl.style.width = sunEl.style.height = sunPx + 'px';
  sunEl.style.left = geo.cx + 'px';
  sunEl.style.top = geo.cy + 'px';
  sunEl._tag.style.left = geo.cx + 'px';
  sunEl._tag.style.top = geo.cy + sunPx / 2 + 8 + 'px';
  glow.style.width = glow.style.height = sunPx * 3.4 + 'px';
  glow.style.left = geo.cx + 'px';
  glow.style.top = geo.cy + 'px';
  planetEls.forEach(item => { item.px = sz(item.p.size); item.el.style.width = item.el.style.height = item.px + 'px'; });
  moonEl.style.width = moonEl.style.height = Math.max(MOON.size * s, 8) + 'px';
}

function pos(r, a) {
  const { s, portrait } = geo;
  return portrait
    ? { x: Math.cos(a) * r * TILT * s, y: Math.sin(a) * r * s }
    : { x: Math.cos(a) * r * s, y: Math.sin(a) * r * TILT * s };
}

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now();
function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  const k = reduceMotion ? 0 : 1;
  planetEls.forEach(item => {
    item.a += item.p.speed * dt * k;
    const { x, y } = pos(item.p.r, item.a);
    item.el.style.left = geo.cx + x + 'px';
    item.el.style.top = geo.cy + y + 'px';
    item.el._tag.style.left = geo.cx + x + 'px';
    item.el._tag.style.top = geo.cy + y + (item.px || 0) / 2 + 6 + 'px';
    // planets behind the sun sit under it
    item.el.style.zIndex = Math.sin(item.a) < 0 ? 4 : 11;
  });
  moonA += MOON.speed * dt * k;
  const host = planetEls[0];
  const hp = pos(host.p.r, host.a), mp = pos(MOON.r, moonA);
  moonEl.style.left = geo.cx + hp.x + mp.x + 'px';
  moonEl.style.top = geo.cy + hp.y + mp.y + 'px';
  requestAnimationFrame(tick);
}

/* ───────────── VIEW TOGGLE ───────────── */

function setView(v, save = true) {
  document.body.className = v;
  document.querySelectorAll('.toggle button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
  if (save) {
    try { localStorage.setItem('shanz-view', v); } catch (e) {}
    history.replaceState(null, '', v === 'list' ? '#list' : location.pathname);
  }
  if (v === 'orbit') requestAnimationFrame(layout);
  window.scrollTo(0, 0);
}
document.querySelectorAll('.toggle button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));

let initial = 'orbit';
try { initial = localStorage.getItem('shanz-view') || 'orbit'; } catch (e) {}
if (location.hash === '#list') initial = 'list';
setView(initial, false);
layout();
requestAnimationFrame(tick);
window.addEventListener('resize', layout);

/* ───────────── PANEL + DETAIL ───────────── */

const panel = document.getElementById('panel');
function openPanel(key) {
  document.getElementById('panel-title').textContent = SECTIONS[key].title;
  document.getElementById('panel-desc').textContent = SECTIONS[key].desc;
  document.getElementById('panel-body').innerHTML = RENDER[key]();
  document.getElementById('panel-inner').scrollTop = 0;
  panel.classList.add('active');
  bindCursor(panel);
}
function closePanel() { panel.classList.remove('active'); }
panel.addEventListener('click', e => { if (e.target === panel) closePanel(); });

const detail = document.getElementById('detail');
function openDetail(id) {
  const b = BUILDS.find(x => x.id === id);
  if (!b) return;
  const n = BUILDS.indexOf(b) + 1;
  const secs = [
    ['how it started', b.sections.started],
    ['the goal', b.sections.goal],
    ['the process', b.sections.process],
    ['the result', b.sections.result],
    ['next steps', b.sections.next]
  ];
  document.getElementById('detail-inner').innerHTML = `
    <button type="button" class="back" onclick="closeDetail()">← back</button>
    <div class="d-eyebrow">build 0${n} ✦ behind the scenes</div>
    <h2 class="d-title">${b.title}</h2>
    <div class="d-meta">${b.short}<br/><a href="${b.link}" target="_blank" rel="noopener">try it ↗</a></div>
    ${secs.map(([h, body], i) => `
      <section class="d-sec">
        <div class="d-num">0${i + 1} / 05</div>
        <h3 class="d-h">${h}</h3>
        <div class="d-body">${body}</div>
      </section>`).join('')}
    <div class="d-stack"><div class="d-num">tools used</div><div class="chips">${b.stack.map(s => `<span class="chip">${s}</span>`).join('')}</div></div>
  `;
  detail.scrollTop = 0;
  detail.classList.add('open');
  bindCursor(detail);
}
function closeDetail() { detail.classList.remove('open'); }

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (detail.classList.contains('open')) closeDetail(); else closePanel();
});

/* ───────────── STARS + CURSOR ───────────── */

const stars = document.getElementById('stars');
for (let i = 0; i < 180; i++) {
  const s = document.createElement('div'); s.className = 'star';
  const sz = Math.random() < 0.12 ? 2 : 1;
  s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;--d:${2 + Math.random() * 4}s;--delay:${Math.random() * 6}s;--op:${0.2 + Math.random() * 0.5};`;
  stars.appendChild(s);
}

const cursor = document.getElementById('cursor');
document.addEventListener('mousemove', e => { cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px'; });
function bindCursor(root) {
  root.querySelectorAll('button, a').forEach(el => {
    if (el.dataset.cur) return; el.dataset.cur = 1;
    el.addEventListener('mouseenter', () => cursor.classList.add('big'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('big'));
  });
}
bindCursor(document);
</script>
</body>
</html>
