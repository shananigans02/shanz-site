<script>
  // set the theme before first paint so there is no flash
  (function () {
    var t = null;
    try { t = localStorage.getItem('shanz-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = 'light'; // everyone starts in light mode
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"/>
<style>
  /* ── THEME TOKENS ── */
  :root, :root[data-theme="dark"] {
    --bg: #000000;
    --ink: #efe9da;
    --muted: #a39e92;
    --faint: #6f6b63;
    --rule: rgba(239,233,218,.12);
    --ring: rgba(239,233,218,.08);
    --star: #efe9da;
    --star-max: .6;
    --scrim: rgba(0,0,0,.96);
    --sun-glow: rgba(254,220,60,.30); --sun-glow2: rgba(254,220,60,.12);
    --night: .32; --earth-glow: rgba(170,215,235,.22); --mars-glow: rgba(240,160,130,.18); --saturn-glow: rgba(240,220,170,.16);
    --moon-glow: rgba(255,255,255,.55); --ring-a: rgba(236,222,186,.14); --ring-b: rgba(242,230,198,.38);
    --writing-hi: #9fd0e6; --writing: #6aafcf; --writing-lo: #3f7f9e; --writing-glow: rgba(106,175,207,.28);
    --building-hi: #f2c697; --building: #e0a86e; --building-lo: #a8763f; --building-glow: rgba(224,168,110,.26);
    --quests-hi: #eb9c80; --quests: #d4795a; --quests-lo: #9c4f36; --quests-glow: rgba(212,121,90,.26);
    --moon: #e6e2d8;
    --ok: #9fd8b8; --plan: #a6c3e6;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f7f4e9;
    --ink: #2b2b2b;
    --muted: #6b6b6b;
    --faint: #9a968c;
    --rule: #dfdbd4;
    --ring: rgba(43,43,43,.11);
    --star: #2b2b2b;
    --star-max: 0;
    --scrim: rgba(247,244,233,.97);
    --sun-glow: rgba(238,180,60,.34); --sun-glow2: rgba(238,180,60,.12);
    --night: .22; --earth-glow: rgba(120,170,200,.2); --mars-glow: rgba(210,130,100,.16); --saturn-glow: rgba(200,170,110,.16);
    --moon-glow: rgba(255,255,255,.7); --ring-a: rgba(196,170,120,.14); --ring-b: rgba(190,160,105,.36);
    --writing-hi: #a9cbdb; --writing: #7fa9bf; --writing-lo: #567f95; --writing-glow: rgba(127,169,191,.22);
    --building-hi: #ecc9a3; --building: #d6a676; --building-lo: #a77a4b; --building-glow: rgba(214,166,118,.22);
    --quests-hi: #e2a58d; --quests: #c97f63; --quests-lo: #95543e; --quests-glow: rgba(201,127,99,.2);
    --moon: #b9b4a8;
    --ok: #3f7d5a; --plan: #3f6a9a;
    color-scheme: light;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'EB Garamond', Garamond, 'Times New Roman', serif;
    font-size: 19px; line-height: 1.6;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: 'liga', 'kern';
    transition: background .4s, color .4s;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  ::selection { background: var(--ink); color: var(--bg); }
  .label { font-variant: all-small-caps; letter-spacing: .08em; }

  /* custom cursor (real mice only): a small glowing comet whose tail stretches with speed */
  #cursor { display: none; }
  :root { --c-core: #fffbe8; --c-mid: #ffd98a; --c-glow: rgba(255,205,120,.55); --c-haze: rgba(255,190,90,.22); }
  :root[data-theme="light"] { --c-core: #fff3cf; --c-mid: #f0b24a; --c-glow: rgba(236,165,55,.55); --c-haze: rgba(236,170,70,.22); }
  @media (hover: hover) and (pointer: fine) {
    html, body, a, button, summary { cursor: none; }
    #cursor { display: block; position: fixed; top: 0; left: 0; width: 0; height: 0; z-index: 9999; pointer-events: none; }
    #cursor .head {
      position: absolute; width: 9px; height: 9px; left: -4.5px; top: -4.5px; border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, var(--c-core), var(--c-mid) 70%);
      box-shadow: 0 0 8px 3px var(--c-glow), 0 0 22px 9px var(--c-haze);
      transition: transform .25s ease, box-shadow .25s ease;
    }
    #cursor .tail {
      position: absolute; left: 0; top: -3px; height: 6px; width: 0; border-radius: 3px;
      transform-origin: 0 50%;
      background: linear-gradient(90deg, var(--c-mid), var(--c-glow) 30%, var(--c-haze) 65%, transparent);
      filter: blur(1.4px);
    }
    #cursor.big .head { transform: scale(1.7); box-shadow: 0 0 12px 5px var(--c-glow), 0 0 30px 12px var(--c-haze); }
  }

  /* stars */
  #stars { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .star { position: absolute; border-radius: 50%; background: var(--star); opacity: 0;
    animation: twinkle var(--d,3s) ease-in-out infinite var(--delay,0s); }
  @keyframes twinkle { 0%,100%{opacity:0} 50%{opacity:calc(var(--op,.6) * var(--star-max))} }

  /* ── TOP NAV (links, view, lamp) ── */
  #nav {
    position: fixed; z-index: 60; top: max(16px, env(safe-area-inset-top)); right: 16px;
    display: flex; align-items: center; gap: 22px; font-size: 17px; color: var(--muted);
  }
  #nav a { text-decoration: none; transition: color .2s; }
  #nav a:hover { color: var(--ink); }
  .icons { display: inline-flex; align-items: center; gap: inherit; }
  .ico { position: relative; width: 20px; height: 32px; display: inline-grid; place-items: center; color: var(--muted); transition: color .2s; }
  .ico::after { content: ''; position: absolute; inset: -4px -10px; } /* comfortable tap area */
  .ico:hover, .ico:focus-visible { color: var(--ink); }
  .ico svg { width: 20px; height: 20px; overflow: visible; grid-area: 1 / 1; transition: opacity .35s ease, transform .5s ease; }
  /* the view toggle shows where it takes you: lines (list) from the planets, a planet from the list */
  body.orbit .g-orbit, body.list .g-list { opacity: 0; transform: scale(.7); }
  /* the theme toggle is a half-filled circle that turns over */
  :root[data-theme="light"] .g-theme { transform: rotate(180deg); }
  .tip { position: absolute; top: 100%; left: 50%; transform: translate(-50%, 2px); white-space: nowrap;
    font-style: italic; font-size: 15px; color: var(--muted); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
  .ico:hover .tip, .ico:focus-visible .tip { opacity: 1; transform: translate(-50%, 4px); }

  /* ── INTRO ── */
  #top { position: relative; z-index: 20; padding: calc(max(16px, env(safe-area-inset-top)) + 58px) 20px 4px; }
  .intro p { color: var(--ink); }
  .intro p + p { margin-top: 10px; }
  .intro .hello { font-size: 1.32em; line-height: 1.3; margin-bottom: 18px; }
  .credit { font-size: 14px; color: var(--faint); margin-top: 22px; font-style: italic; }
  .credit a { color: inherit; }

  /* ── ORBIT VIEW ── */
  body.orbit { height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
  #stage { position: relative; z-index: 1; flex: 1; min-height: 0; }
  body.list #stage { display: none; }
  #system { position: absolute; inset: 0; }
  .ring { position: absolute; border-radius: 50%; border: 1px solid var(--ring);
    transform: translate(-50%,-50%); pointer-events: none; }
  .body-btn { position: absolute; border-radius: 50%; transform: translate(-50%,-50%); z-index: 5; padding: 0; }
  .body-btn:focus-visible { outline: 1px dashed var(--ink); outline-offset: 6px; }
  .body-btn::after { content: ''; position: absolute; inset: -14px; border-radius: 50%; } /* bigger tap target */
  .pl { position: relative; width: 100%; height: 100%; transition: transform .35s cubic-bezier(.34,1.56,.64,1), filter .25s; }
  .body-btn:hover .pl { transform: scale(1.1); filter: brightness(1.06); }
  .orb { position: relative; z-index: 1; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; }
  .shade { position: absolute; inset: 0; border-radius: 50%;
    background: linear-gradient(90deg, rgba(255,255,255,.18) 0%, transparent 40%, rgba(0,0,0,calc(var(--night) * .4)) 70%, rgba(0,0,0,var(--night)) 100%); }
  .sun-orb {
    background: radial-gradient(circle at 36% 36%, #fffde0, #fef7dc 55%, #e2c25a);
    box-shadow: 0 0 55px 18px rgba(254,220,60,.26), 0 0 120px 50px rgba(254,247,220,.08);
    animation: pulse-orb 4s ease-in-out infinite;
  }
  :root[data-theme="light"] .sun-orb {
    background: radial-gradient(circle at 36% 36%, #fff6cf, #f7d877 52%, #e5a640);
    box-shadow: 0 0 0 1px rgba(214,150,50,.18), 0 0 40px 10px rgba(240,180,60,.35), 0 0 110px 40px rgba(240,190,80,.16);
    animation: none;
  }
  @keyframes pulse-orb {
    0%,100% { box-shadow: 0 0 55px 18px rgba(254,220,60,.26), 0 0 120px 50px rgba(254,247,220,.08); }
    50%     { box-shadow: 0 0 85px 28px rgba(254,220,60,.34), 0 0 170px 72px rgba(254,247,220,.12); }
  }
  /* soft, pastel planets: they read as earth, mars and a ringed giant without the photo realism */
  .earth  { background: radial-gradient(circle at 35% 32%, #cfe6ef, #9cc6d8 48%, #6f9fb8); box-shadow: 0 0 30px 6px var(--earth-glow); }
  .mars   { background: radial-gradient(circle at 35% 32%, #f3c3ad, #e0977a 52%, #b8705a); box-shadow: 0 0 24px 4px var(--mars-glow); }
  .saturn { background: radial-gradient(circle at 35% 30%, #f6e8c6, #e3cd9c 50%, #c2a26b); box-shadow: 0 0 34px 6px var(--saturn-glow); }
  .s-ring {
    position: absolute; left: 50%; top: 50%; width: 205%; height: 50%; border-radius: 50%; pointer-events: none;
    transform: translate(-50%,-50%) rotate(-12deg);
    background: radial-gradient(closest-side, transparent 0 68%, var(--ring-a) 72%, var(--ring-b) 79%, var(--ring-a) 86%, transparent 91%);
  }
  .s-ring.back { z-index: 0; clip-path: inset(0 0 50% 0); }
  .s-ring.front { z-index: 2; clip-path: inset(50% 0 0 0); }
  .moon-orb { background: radial-gradient(circle at 40% 38%, #ffffff, #f0efea 60%, #d8d6cf); box-shadow: 0 0 16px 5px var(--moon-glow); }
  .tbd { font-style: italic; color: var(--muted); font-size: 20px; padding: 18px 2px; }
  .tag {
    position: absolute; transform: translateX(-50%); z-index: 50;
    white-space: nowrap; text-align: center; pointer-events: none;
    font-style: italic; font-size: 18px; color: var(--ink);
    text-shadow: 0 0 6px var(--bg), 0 0 12px var(--bg), 0 0 2px var(--bg);
    opacity: 0; transition: opacity .25s;
  }
  .tag.show { opacity: 1; }

  #sun-glow {
    position: absolute; border-radius: 50%; transform: translate(-50%,-50%); pointer-events: none; z-index: 2;
    background: radial-gradient(circle, var(--sun-glow) 0%, var(--sun-glow2) 30%, transparent 66%);
    animation: pulse-sun 4s ease-in-out infinite;
  }
  @keyframes pulse-sun { 0%,100%{opacity:.75} 50%{opacity:1} }
  #hint {
    position: absolute; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    font-style: italic; font-size: 16px; color: var(--faint);
    white-space: nowrap; pointer-events: none; animation: fade-hint 9s ease forwards 2s;
  }
  @keyframes fade-hint { 0%,70%{opacity:1} 100%{opacity:0} }
  @media (max-width: 600px) { .tag { font-size: 16px; } #nav { gap: 20px; } }
  @media (hover: none) { .tip { display: none; } } /* no hover on phones, so no sticky hover word */

  @media (min-width: 900px) {
    #nav { right: 32px; top: 24px; }
    body.orbit #top { position: fixed; top: 34px; left: 40px; padding: 0; max-width: 460px; }
    body.orbit #stage { position: fixed; inset: 0; }
  }
  /* wide screens: intro is a left column, vertically centered; orbit takes the right */
  @media (min-width: 1200px) and (min-height: 560px) {
    #nav { right: clamp(40px, 4.4vw, 88px); top: 36px; font-size: 18px; }
    body.orbit #top { top: 50%; left: clamp(48px, 5vw, 96px); transform: translateY(-50%); max-width: 520px; }
    body.orbit .intro { font-size: 20px; line-height: 1.65; }
    body.orbit .intro p + p { margin-top: 14px; }
    body.orbit #hint { left: var(--hint-x, 50%); }
  }

  /* ── LIST VIEW ── */
  #list { display: none; position: relative; z-index: 1; }
  body.list #list { display: block; }
  body.list #top, #list .wrap { max-width: 680px; margin: 0 auto; }
  body.list #top { padding-top: calc(max(16px, env(safe-area-inset-top)) + 84px); }
  #list .wrap { padding: 8px 20px 96px; }
  .sec { margin-top: 0; border-bottom: 1px solid var(--rule); }
  #list .wrap > .sec:first-child { margin-top: 40px; border-top: 1px solid var(--rule); }
  .sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 2px; cursor: pointer; list-style: none; }
  .sec-head::-webkit-details-marker { display: none; }
  .sec-title { font-weight: 400; font-size: 1em; line-height: 1.4; }
  .sec-mark { position: relative; width: 11px; height: 11px; flex-shrink: 0; color: var(--muted); }
  .sec-mark::before, .sec-mark::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: currentColor; transition: transform .3s ease; }
  .sec-mark::after { transform: rotate(90deg); }
  .sec[open] .sec-mark::after { transform: rotate(0deg); }
  .sec-head:hover .sec-mark { color: var(--ink); }
  .sec-body { padding: 0 2px 26px; }
  .about-text { font-size: 19px; line-height: 1.7; }
  .about-text p + p { margin-top: 16px; }
  .about-text a, .d-body a { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; text-decoration-color: var(--faint); }
  .about-text a:hover, .d-body a:hover { text-decoration-color: var(--ink); }

  /* ── shared items ── */
  .items { display: flex; flex-direction: column; }
  .item { display: grid; grid-template-columns: 30px 1fr; gap: 14px; padding: 20px 2px; border-bottom: 1px solid var(--rule); }
  .item:last-child { border-bottom: none; }
  .dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; margin-top: 4px; }
  .dot i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .item-title { font-weight: 500; font-size: 21px; line-height: 1.3; }
  .item-meta { font-size: 15px; color: var(--muted); margin-top: 2px; }
  .item-blurb { font-size: 18px; line-height: 1.6; color: var(--muted); margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; }
  .chip { font-style: italic; font-size: 15px; color: var(--faint); }
  .actions { display: flex; gap: 20px; margin-top: 10px; }
  .act { font-size: 17px; color: var(--ink); text-decoration: underline; text-underline-offset: 4px;
    text-decoration-thickness: 1px; text-decoration-color: var(--faint); padding: 2px 0; }
  .act:hover { text-decoration-color: var(--ink); }
  .more { display: inline-block; margin-top: 14px; }
  .quest { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: baseline;
    padding: 12px 2px; border-bottom: 1px solid var(--rule); }
  .quest:last-child { border-bottom: none; }
  .q-status { font-variant: all-small-caps; letter-spacing: .08em; font-size: 17px; color: var(--faint); white-space: nowrap; }
  .q-status.completed { color: var(--ok); }
  .q-status.scheduled { color: var(--plan); }
  .q-status.progress  { color: var(--ink); }
  .q-name { font-size: 18px; }
  .q-detail { display: block; font-style: italic; font-size: 15px; color: var(--muted); margin-top: 1px; }

  /* ── PANEL (orbit view) ── */
  #panel {
    position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center;
    background: transparent; pointer-events: none; transition: background .4s; padding: 16px;
  }
  #panel.active { background: var(--scrim); pointer-events: all; }
  #panel-inner {
    width: min(680px, 100%); max-height: 86dvh; overflow-y: auto; overscroll-behavior: contain;
    opacity: 0; transform: translateY(10px); transition: opacity .35s, transform .35s ease;
    scrollbar-width: none;
  }
  #panel-inner::-webkit-scrollbar { display: none; }
  #panel.active #panel-inner { opacity: 1; transform: none; }
  .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    padding-bottom: 14px; margin-bottom: 8px; border-bottom: 1px solid var(--rule); }
  .panel-title { font-weight: 400; font-size: clamp(34px, 7vw, 48px); line-height: 1; }
  .panel-desc { font-style: italic; font-size: 17px; color: var(--muted); margin-top: 8px; }
  .close { font-size: 17px; color: var(--muted); padding: 6px 0; flex-shrink: 0; }
  .close:hover { color: var(--ink); }

  /* ── DETAIL PAGE ── */
  #detail {
    position: fixed; inset: 0; z-index: 200; background: var(--bg); overflow-y: auto;
    transform: translateX(100%); transition: transform .5s cubic-bezier(.77,0,.18,1); visibility: hidden;
  }
  #detail.open { transform: none; visibility: visible; }
  .detail-inner { max-width: 650px; margin: 0 auto; padding: calc(max(18px, env(safe-area-inset-top)) + 40px) 20px 120px; }
  .back { font-size: 17px; color: var(--muted); margin-bottom: 40px; padding: 6px 0; }
  .back:hover { color: var(--ink); }
  .d-eyebrow { font-variant: all-small-caps; letter-spacing: .1em; font-size: 17px; color: var(--muted); margin-bottom: 8px; }
  .d-title { font-weight: 400; font-size: clamp(36px, 7vw, 52px); line-height: 1.05; margin-bottom: 14px; }
  .d-meta { font-style: italic; font-size: 18px; color: var(--muted); line-height: 1.6;
    padding-bottom: 24px; margin-bottom: 36px; border-bottom: 1px solid var(--rule); }
  .d-meta a { color: var(--ink); text-underline-offset: 3px; }
  .d-sec { margin-bottom: 36px; }
  .d-num { font-variant: all-small-caps; letter-spacing: .1em; font-size: 15px; color: var(--faint); margin-bottom: 2px; }
  .d-h { font-weight: 400; font-style: italic; font-size: 24px; margin-bottom: 8px; }
  .d-body { font-size: 19px; line-height: 1.75; }
  .d-body ul { padding-left: 20px; }
  .d-body li + li { margin-top: 4px; }
  .d-stack { margin-top: 44px; }

  @media (prefers-reduced-motion: reduce) {
    .star, #sun-glow, .sun-orb { animation: none; }
    .star { opacity: calc(.35 * var(--star-max)); }
  }
</style>
</head>
<body class="orbit">

<div id="cursor" aria-hidden="true"><span class="tail"></span><span class="head"></span></div>
<div id="stars"></div>

<nav id="nav" aria-label="links">
  <a href="https://substack.com/@notshananigans" target="_blank" rel="noopener">Substack</a>
  <a href="https://x.com/notshananigans" target="_blank" rel="noopener">X</a>
  <span class="icons">
    <button type="button" class="ico" id="view-toggle" aria-label="switch to list view">
      <svg class="g-list" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1"><path d="M3.8 6h12.4M3.8 10h12.4M3.8 14h12.4"/></svg>
      <svg class="g-orbit" viewBox="0 0 20 20" fill="none" stroke="currentColor"><g transform="rotate(-20 10 10)"><ellipse cx="10" cy="10" rx="10" ry="2.8" stroke-width=".8"/><circle cx="10" cy="10" r="6.2" fill="var(--bg)" stroke-width="1.05"/><path d="M0 10a10 2.8 0 0 0 20 0" stroke-width=".8"/></g></svg>
      <span class="tip" id="view-tip">list</span>
    </button>
    <button type="button" class="ico" id="theme-toggle" aria-label="switch theme">
      <svg class="g-theme" viewBox="0 0 20 20" fill="none" stroke="currentColor"><circle cx="10" cy="10" r="6.2" stroke-width="1.05"/><path d="M10 3.8a6.2 6.2 0 0 0 0 12.4z" fill="currentColor" stroke="none"/></svg>
      <span class="tip" id="theme-tip">light</span>
    </button>
  </span>
</nav>

<header id="top">
  <div class="intro">
    <p>during the day, i work in consulting and take ai products from strategy to deployment</p>
    <p>after hours, i vibecode, pull apart open-source projects, and write about ai applications</p>
    <p>in between, i'm taking damage at barry's or overinterpreting art</p>
  </div>
</header>

<main id="stage" aria-label="orbit view">
  <div id="system"></div>
</main>

<main id="list" aria-label="list view"><div class="wrap" id="list-wrap"></div></main>

<div id="panel" role="dialog" aria-modal="true">
  <div id="panel-inner">
    <div class="panel-head">
      <div>
        <div class="panel-title" id="panel-title"></div>
      </div>
      <button type="button" class="close" onclick="closePanel()">close</button>
    </div>
    <div id="panel-body"></div>
  </div>
</div>

<div id="detail" role="dialog" aria-modal="true"><div class="detail-inner" id="detail-inner"></div></div>

<script>
/* ───────────── CONTENT ───────────── */

const ABOUT = `
  <p>i'm a consultant in nyc. most days i sit between the people who want an ai product and the engineers building it, and try to get it from a deck to something people use. before that, i did diligence and integration work on tech deals.</p>
  <p>after hours, i write long breakdowns of ai applications on <a href="https://substack.com/@notshananigans" target="_blank" rel="noopener">substack</a>: who buys them, why, and what has to be true for them to work. i also vibecode, mostly by forking open-source projects and pulling them apart until i understand them.</p>
  <p>in between, i'm taking damage at barry's or overinterpreting art.</p>
  <p>please reach me on <a href="https://x.com/notshananigans" target="_blank" rel="noopener">x</a>, where ai projects, art and miscellany are very much solicited</p>
`;

const WRITING = [
  {
    title: 'inside simile: what it means to simulate human behavior for enterprises',
    date: 'apr 2026',
    blurb: "how simile's ai agents work, where they fit into real customer research workflows, and a scorecard for which enterprise use cases to go after first.",
    tags: ['go-to-market', 'ai agents', 'enterprise software', 'customer research'],
    link: 'https://notshananigans.substack.com/p/inside-simile-what-it-means-to-simulate',
    color: '#E05A4E'
  },
  {
    title: 'the humans grading ai: on the contractor problem at the heart of frontier model training',
    date: 'apr 2026',
    blurb: 'scale, surge, mercor and the rest sell expert judgment to frontier labs. the hard part is getting consistent, elite work out of a contractor base that can leave whenever it wants.',
    tags: ['ai infrastructure', 'post-training', 'marketplaces', 'operations'],
    link: 'https://notshananigans.substack.com/p/the-humans-grading-the-ai-on-the',
    color: '#7ab8d4'
  }
];

const LINK = (href, text) => `<a href="${href}" target="_blank" rel="noopener">${text}</a>`;

const BUILDS = [
  {
    id: 'photobooth',
    title: 'get in da (photo)booth',
    short: 'a browser photobooth that reacts to your face. three models, no server.',
    link: 'https://get-in-da-booth.netlify.app/',
    color: '#e8a8c7',
    stack: ['face-api.js', 'mediapipe hands', 'claude', 'netlify'],
    sections: {
      started: `as always, it started with an x post. it was figmathon season, and i came across ${LINK('https://x.com/lalizlabeth/status/1966002793371619353?s=46', "@lalizlabeth")}'s #figmamakeathon submission where you can meow with your hands. catgirl allegations aside, it's super cute. it also reminded me of ${LINK('https://x.com/immike_wing/status/2009057802400969150?s=46', "@immike_wing")}'s arc'teryx beanie detector, which is pretty funny. both got me thinking about what image detection can actually do in the browser, and how approachable it's gotten.`,
      goal: `a simple photobooth with sounds. i had just come off a tiktok and megan thee stallion bender, so they made it into the audio.`,
      process: `there are two components: detection and sounds.<br/><br/><b>detection:</b> the app runs three neural network models entirely in the browser with face-api.js. one finds your face, one maps 68 landmark points across it (corners of your mouth, tip of your nose, jaw outline), and one classifies your expression into one of 7 emotions. gestures are computed from those coordinates directly. duck face checks whether your mouth is unusually narrow relative to your face.<br/><br/><b>sounds:</b> short clips, triggered on detection, with cooldown timers so they don't spam.<br/><br/>claude pretty much one-shotted the working prototype. there was some back and forth on thresholds and cooldowns, but it came together fast. two problems didn't have an easy fix:<br/><br/>i was quite excited about megan's ah. the landmark model has no tongue keypoint, only "mouth very extremely open," which fires on fah and ah pretty interchangeably. hand gestures (finger gun, heart) are also unreliable. the lite model running in-browser silently skips frames depending on lighting, hand angle and distance. i cut both for now. a vision api call to check for tongue specifically felt like overkill for a silly project.`,
      result: `issues aside, it can do some stuff:<br/><ul><li>live emotion detection with color washes. happy goes warm yellow, surprised triggers a flash and zoom</li><li>fah / ah when your mouth opens</li></ul><br/>the part i found most interesting: no server, no backend, no api calls. models load from a cdn in a few seconds and everything runs on your device.`,
      next: `<ul><li>snapchat-style filters. i grew up on those, so face-tracked overlays (dog ears, talking orange) will be fun to recreate</li><li>real tongue detection, either a model with tongue keypoints or a lightweight vision api call</li><li>hand gestures that work. finger gun and korean heart are in the code, they just don't fire reliably. worth testing whether a heavier model or better calibration fixes it</li></ul>`
    }
  },
  {
    id: 'shoyo',
    title: 'shoyo, but infinite',
    short: 'an open-source infinite canvas, forked and refilled with ai-generated hinata figurines.',
    link: 'https://just-shoyo-activities-v2.vercel.app/',
    color: '#f0a050',
    stack: ['react', 'three.js / r3f', 'vite', 'tailwind', 'chatgpt images', 'vercel'],
    sections: {
      started: `${LINK('https://x.com/phatggg', '@phatggg')} built ${LINK('https://www.yyyyaaa.com/', 'yyyyaaa.com')}: an endless white void full of tiny dioramas of the same guy doing strange office tasks. very severance. then he ${LINK('https://github.com/yyyyaaa/yyyyaaa-2026', 'open-sourced it')}. i wanted to know if i could keep the engine and swap everything on top of it.`,
      goal: `same infinite canvas, different universe: hinata shoyo from haikyuu, in figurine form, doing small ordinary things forever. something you wander through more than read.`,
      process: `two parts: the engine and the images.<br/><br/><b>engine:</b> the canvas is react three fiber. the world is split into chunks, and only chunks near the camera render. images lazy-load, fade with depth, and you can drag, scroll, pinch or use wasd. i mostly left the engine alone and learned it by reading it. my changes sat on top: the image manifest, the overlay (logo, a "fan request" button that opens a pre-filled post to me on x, an fyi panel crediting the original), and seo.<br/><br/><b>images:</b> 14 figurine dioramas generated in chatgpt from one long prompt. the hard part was consistency. early outputs drifted chibi or landed on blocky, lego-looking bases, so the prompt grew a negative section that bans both. the full prompt is in the fyi panel on the site if you want to make your own.`,
      result: `an infinite gallery of hinata spiking, sleeping, feeding crows, carrying groceries, eating ramen and texting kageyama. it works on phones with touch. the engine held up fine with a completely different set of images, which was the real test of the fork.`,
      next: `<ul><li>fulfill fan requests as they come in</li><li>more poses, so the canvas repeats less as you wander</li></ul>`
    }
  }
];


const SECTIONS = {
  about:      { title: 'about', desc: '' },
  writing:    { title: 'writing', desc: '' },
  vibecoding: { title: 'vibecoding', desc: '' },
  art:        { title: 'art', desc: '' }
};

/* ───────────── RENDERERS (shared by panel + list) ───────────── */

const dot = c => `<div class="dot" style="background:color-mix(in srgb, ${c} 12%, transparent);border:1px solid color-mix(in srgb, ${c} 35%, transparent)"><i style="background:${c}"></i></div>`;

function renderWriting() {
  return `<div class="items">${WRITING.map(w => `
    <article class="item">
      ${dot(w.color)}
      <div>
        <div class="item-title">${w.title}</div>
        <div class="item-meta">${w.date}</div>
        <p class="item-blurb">${w.blurb}</p>
        <div class="chips">${w.tags.map(t => `<span class="chip">${t}</span>`).join('')}</div>
        <div class="actions"><a class="act" href="${w.link}" target="_blank" rel="noopener">read ↗</a></div>
      </div>
    </article>`).join('')}
  </div>
  <a class="act more" href="https://notshananigans.substack.com/archive" target="_blank" rel="noopener">everything on substack ↗</a>`;
}

function renderBuilds() {
  return `<div class="items">${BUILDS.map(b => `
    <article class="item">
      ${dot(b.color)}
      <div>
        <div class="item-title">${b.title}</div>
        <p class="item-blurb">${b.short}</p>
        <div class="chips">${b.stack.map(s => `<span class="chip">${s}</span>`).join('')}</div>
        <div class="actions">
          <a class="act" href="${b.link}" target="_blank" rel="noopener">try it ↗</a>
          <button type="button" class="act" onclick="openDetail('${b.id}')">how i built it →</button>
        </div>
      </div>
    </article>`).join('')}
  </div>`;
}

const RENDER = {
  about: () => `<div class="about-text">${ABOUT}</div>`,
  writing: renderWriting,
  vibecoding: renderBuilds,
  art: () => `<p class="tbd">tbd</p>`
};

/* ───────────── LIST VIEW ───────────── */

document.getElementById('list-wrap').innerHTML = ['about', 'vibecoding', 'writing', 'art'].map(k => `
  <details class="sec" id="sec-${k}">
    <summary class="sec-head"><h2 class="sec-title">${SECTIONS[k].title}</h2><span class="sec-mark" aria-hidden="true"></span></summary>
    <div class="sec-body">${RENDER[k]()}</div>
  </details>`).join('');

/* ───────────── ORBIT VIEW ───────────── */

const TILT = 0.36;
// sizes and orbits keep real-world order and rough proportion (compressed so it fits on a screen):
// the star is largest, the earth-like planet is mid-sized, the mars-like one about half that,
// and the ringed giant is the biggest planet and slowest, on the outermost orbit
const SUN = { id: 'sun', key: 'about', size: 150 };
const PLANETS = [
  { id: 'writing',    key: 'writing',    look: 'earth',  size: 46, r: 160, speed: 0.10,  angle: 0.5 },
  { id: 'vibecoding', key: 'vibecoding', look: 'mars',   size: 30, r: 232, speed: 0.06,  angle: 3.4 },
  { id: 'art',        key: 'art',        look: 'saturn', size: 86, r: 340, speed: 0.024, angle: 2.1, ring: true }
];
const MOON = { size: 12, r: 36, speed: 0.45, angle: 1.2 }; // decorative, orbits the earth-like planet

const system = document.getElementById('system');
const stage = document.getElementById('stage');
const glow = document.createElement('div'); glow.id = 'sun-glow'; system.appendChild(glow);

function makeBody(p, isSun) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'body-btn';
  if (isSun) b.id = 'sun';
  b.setAttribute('aria-label', `open ${SECTIONS[p.key].title}`);
  const pl = document.createElement('div');
  pl.className = 'pl';
  if (p.ring) pl.insertAdjacentHTML('beforeend', '<div class="s-ring back"></div>');
  const orb = document.createElement('div');
  orb.className = 'orb ' + (isSun ? 'sun-orb' : p.look);
  if (!isSun) { const sh = document.createElement('div'); sh.className = 'shade'; orb.appendChild(sh); b._shade = sh; }
  pl.appendChild(orb);
  if (p.ring) pl.insertAdjacentHTML('beforeend', '<div class="s-ring front"></div>');
  b.appendChild(pl);
  b.addEventListener('click', () => openPanel(p.key));
  ['mouseenter', 'focus'].forEach(ev => b.addEventListener(ev, () => b._tag.classList.add('show')));
  ['mouseleave', 'blur'].forEach(ev => b.addEventListener(ev, () => b._tag.classList.remove('show')));
  system.appendChild(b);
  // labels live in their own top layer so the sun and moon never cover them
  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.textContent = SECTIONS[p.key].title;
  b._tag = tag;
  return b;
}

const rings = PLANETS.map(() => { const r = document.createElement('div'); r.className = 'ring'; system.appendChild(r); return r; });
const sunEl = makeBody(SUN, true);
const planetEls = PLANETS.map(p => ({ p, el: makeBody(p, false), a: p.angle }));

const moonEl = document.createElement('div');
moonEl.className = 'moon-orb';
moonEl.style.cssText = `position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:6;overflow:hidden`;
moonEl.innerHTML = '<div class="shade" style="opacity:.5"></div>';
system.appendChild(moonEl);
[sunEl, ...planetEls.map(x => x.el)].forEach(el => system.appendChild(el._tag));
// phones have no hover: show the labels briefly on arrival, then let them fade
if (window.matchMedia('(hover: none)').matches) {
  [sunEl, ...planetEls.map(x => x.el)].forEach(el => el._tag.classList.add('show'));
  setTimeout(() => [sunEl, ...planetEls.map(x => x.el)].forEach(el => el._tag.classList.remove('show')), 3500);
}
let moonA = MOON.angle;

let geo = { cx: 0, cy: 0, s: 1, portrait: false, T: TILT };
function layout() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return; // orbit view hidden (list view): keep the last layout
  const portrait = h > w * 1.05;
  // on squarer stages (phones), view the system more from above so it fills the space
  const T = portrait ? TILT : Math.min(0.62, Math.max(TILT, (h / w) * 0.62));
  const maxR = PLANETS[PLANETS.length - 1].r;
  const big = Math.max(...PLANETS.map(p => p.ring ? p.size * 2.05 : p.size));
  const labelPad = 40;
  // half-extents of the system at scale 1
  const halfW = portrait ? maxR * T + big / 2 + 70 : maxR + big / 2 + 40;
  const halfH = portrait ? maxR + big / 2 + labelPad : maxR * T + big / 2 + labelPad;
  let s = Math.min((w / 2 - 8) / halfW, (h / 2 - 8) / halfH, 1.2);
  let cy = h / 2, cx = w / 2;
  const wide = !portrait && window.innerWidth >= 1200 && window.innerHeight >= 560;
  if (wide) {
    // intro is a left column: center the system in the space to its right
    const hb = document.getElementById('top').getBoundingClientRect();
    const left = hb.right + 48, regionW = w - left - 24;
    s = Math.min(regionW / 2 / halfW, (h / 2 - 24) / halfH, 1.25);
    cx = left + regionW / 2;
    stage.style.setProperty('--hint-x', cx + 'px');
  } else if (!portrait && window.innerWidth >= 900) {
    // mid-size: the intro floats over the top-left; if the system would run into it,
    // fit the system into the space below the intro instead
    const hb = document.getElementById('top').getBoundingClientRect();
    const overlaps = (cy - halfH * s) < hb.bottom + 12 && (w / 2 - halfW * s) < hb.right;
    if (overlaps) {
      const top = hb.bottom + 12, usable = h - top - 30;
      s = Math.min((w / 2 - 8) / halfW, usable / 2 / halfH, 1.2);
      cy = top + usable / 2;
    }
  }
  geo = { cx, cy, s, portrait, T };

  PLANETS.forEach((p, i) => {
    const a = p.r * 2 * s, b = p.r * 2 * T * s;
    rings[i].style.width = (portrait ? b : a) + 'px';
    rings[i].style.height = (portrait ? a : b) + 'px';
    rings[i].style.left = geo.cx + 'px';
    rings[i].style.top = geo.cy + 'px';
  });
  const sz = v => Math.max(v * s, v * 0.42);
  const sunPx = sz(SUN.size) * (portrait ? 0.75 : 1);
  sunEl.style.width = sunEl.style.height = sunPx + 'px';
  sunEl.style.left = geo.cx + 'px';
  sunEl.style.top = geo.cy + 'px';
  sunEl._tag.style.left = geo.cx + 'px';
  sunEl._tag.style.top = geo.cy + sunPx / 2 + 8 + 'px';
  glow.style.width = glow.style.height = sunPx * 4.2 + 'px';
  glow.style.left = geo.cx + 'px';
  glow.style.top = geo.cy + 'px';
  planetEls.forEach(item => { item.px = sz(item.p.size); item.el.style.width = item.el.style.height = item.px + 'px'; });
  moonEl.style.width = moonEl.style.height = Math.max(MOON.size * s, 7) + 'px';
}

function pos(r, a) {
  const { s, portrait } = geo;
  return portrait
    ? { x: Math.cos(a) * r * geo.T * s, y: Math.sin(a) * r * s }
    : { x: Math.cos(a) * r * s, y: Math.sin(a) * r * geo.T * s };
}

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = performance.now();
function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  const k = reduceMotion ? 0.5 : 1; // always orbit; just slower if the visitor prefers less motion
  planetEls.forEach(item => {
    item.a += item.p.speed * dt * k;
    const { x, y } = pos(item.p.r, item.a);
    item.el.style.left = geo.cx + x + 'px';
    item.el.style.top = geo.cy + y + 'px';
    item.el._tag.style.left = geo.cx + x + 'px';
    item.el._tag.style.top = geo.cy + y + (item.px || 0) / 2 + 6 + 'px';
    // planets behind the star sit under it
    item.el.style.zIndex = Math.sin(item.a) < 0 ? 4 : 11;
    if (item.el._shade) item.el._shade.style.transform = `rotate(${Math.atan2(y, x)}rad)`;
  });
  moonA += MOON.speed * dt * k;
  const host = planetEls[0];
  const hp = pos(host.p.r, host.a), mp = pos(MOON.r, moonA);
  moonEl.style.left = geo.cx + hp.x + mp.x + 'px';
  moonEl.style.top = geo.cy + hp.y + mp.y + 'px';
  moonEl.firstChild.style.transform = `rotate(${Math.atan2(hp.y + mp.y, hp.x + mp.x)}rad)`;
  moonEl.style.zIndex = Math.sin(host.a) < 0 ? 4 : 12;
  requestAnimationFrame(tick);
}


/* ───────────── VIEW TOGGLE ───────────── */

function setView(v, save = true) {
  document.body.className = v;
  const vt = document.getElementById('view-toggle');
  vt.setAttribute('aria-label', v === 'orbit' ? 'switch to list view' : 'switch to orbit view');
  document.getElementById('view-tip').textContent = v === 'orbit' ? 'list' : 'orbit';
  if (save) {
    try { localStorage.setItem('shanz-view', v); } catch (e) {}
    history.replaceState(null, '', v === 'list' ? '#list' : location.pathname);
  }
  if (v === 'orbit') requestAnimationFrame(layout);
  window.scrollTo(0, 0);
}
document.getElementById('view-toggle').addEventListener('click', () => setView(document.body.classList.contains('list') ? 'orbit' : 'list'));

/* ───────────── THEME ───────────── */
function applyTheme(t, save) {
  document.documentElement.dataset.theme = t;
  const tip = document.getElementById('theme-tip');
  if (tip) tip.textContent = t === 'light' ? 'dark' : 'light';
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', t === 'light' ? '#f7f4e9' : '#000000');
  if (save) { try { localStorage.setItem('shanz-theme', t); } catch (e) {} }
}
document.getElementById('theme-toggle').addEventListener('click', () =>
  applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light', true));
applyTheme(document.documentElement.dataset.theme || 'light', false);

let initial = 'orbit';
try { initial = localStorage.getItem('shanz-view') || 'orbit'; } catch (e) {}
if (location.hash === '#list') initial = 'list';
setView(initial, false);
layout();
requestAnimationFrame(tick);
window.addEventListener('resize', layout);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

/* ───────────── PANEL + DETAIL ───────────── */

const panel = document.getElementById('panel');
function openPanel(key) {
  document.getElementById('panel-title').textContent = SECTIONS[key].title;
  document.getElementById('panel-body').innerHTML = RENDER[key]();
  document.getElementById('panel-inner').scrollTop = 0;
  panel.classList.add('active');
  bindCursor(panel);
}
function closePanel() { panel.classList.remove('active'); }
panel.addEventListener('click', e => { if (e.target === panel) closePanel(); });

const detail = document.getElementById('detail');
function openDetail(id) {
  const b = BUILDS.find(x => x.id === id);
  if (!b) return;
  const n = BUILDS.indexOf(b) + 1;
  const secs = [
    ['how it started', b.sections.started],
    ['the goal', b.sections.goal],
    ['the process', b.sections.process],
    ['the result', b.sections.result],
    ['next steps', b.sections.next]
  ];
  document.getElementById('detail-inner').innerHTML = `
    <button type="button" class="back" onclick="closeDetail()">← back</button>
    <div class="d-eyebrow">build 0${n} ✦ behind the scenes</div>
    <h2 class="d-title">${b.title}</h2>
    <div class="d-meta">${b.short}<br/><a href="${b.link}" target="_blank" rel="noopener">try it ↗</a></div>
    ${secs.map(([h, body], i) => `
      <section class="d-sec">
        <div class="d-num">0${i + 1} / 05</div>
        <h3 class="d-h">${h}</h3>
        <div class="d-body">${body}</div>
      </section>`).join('')}
    <div class="d-stack"><div class="d-num">tools used</div><div class="chips">${b.stack.map(s => `<span class="chip">${s}</span>`).join('')}</div></div>
  `;
  detail.scrollTop = 0;
  detail.classList.add('open');
  bindCursor(detail);
}
function closeDetail() { detail.classList.remove('open'); }

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (detail.classList.contains('open')) closeDetail(); else closePanel();
});

/* ───────────── STARS + CURSOR ───────────── */

const stars = document.getElementById('stars');
for (let i = 0; i < 180; i++) {
  const s = document.createElement('div'); s.className = 'star';
  const sz = Math.random() < 0.12 ? 2 : 1;
  s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;--d:${2 + Math.random() * 4}s;--delay:${Math.random() * 6}s;--op:${0.2 + Math.random() * 0.5};`;
  stars.appendChild(s);
}

const cursor = document.getElementById('cursor');
const tail = cursor.querySelector('.tail');
let cx = -100, cy = -100, vx = 0, vy = 0, lastMove = performance.now();
document.addEventListener('mousemove', e => {
  const now = performance.now(), dt = Math.max(8, now - lastMove);
  // smoothed velocity in px per frame-ish
  vx = vx * .7 + ((e.clientX - cx) / dt * 16) * .3;
  vy = vy * .7 + ((e.clientY - cy) / dt * 16) * .3;
  cx = e.clientX; cy = e.clientY; lastMove = now;
  cursor.style.transform = `translate(${cx}px, ${cy}px)`;
});
(function comet() {
  vx *= .93; vy *= .93; // the tail settles when the mouse rests
  const speed = Math.hypot(vx, vy);
  const len = Math.min(80, speed * 3.2);
  tail.style.width = len + 'px';
  tail.style.opacity = Math.min(1, speed / 6);
  tail.style.transform = `rotate(${Math.atan2(-vy, -vx)}rad)`; // the tail points back along the path
  requestAnimationFrame(comet);
})();
function bindCursor(root) {
  root.querySelectorAll('button, a').forEach(el => {
    if (el.dataset.cur) return; el.dataset.cur = 1;
    el.addEventListener('mouseenter', () => cursor.classList.add('big'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('big'));
  });
}
bindCursor(document);
</script>
</body>
</html>
